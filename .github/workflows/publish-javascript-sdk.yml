name: Publish JavaScript SDK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/sharptoolz-sdk/**"

concurrency: publish-javascript-sdk

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish to npm
    if: github.repository == 'Printplog/sharptoolz'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@sharp-toolz/sdk
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/sharptoolz-sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install a Trusted Publishing-compatible npm CLI
        run: npm install --global npm@latest

      - name: Install SDK dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund

      - name: Run SDK tests
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      - name: Check whether this version is already published
        id: release
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.release.outputs.should_publish == 'true'
        run: npm publish --access public --provenance
